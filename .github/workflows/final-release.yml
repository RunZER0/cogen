name: final-hackathon-release

on:
  push:
    paths:
      - .github/workflows/final-release.yml
  workflow_dispatch:

concurrency:
  group: cogen-final-release-main
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  SERVICE_NAME: cogen
  GCP_PROJECT_ID: cogen-506607
  GCP_PROJECT_NUMBER: "257066508186"
  GCP_REGION: us-central1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/257066508186/locations/global/workloadIdentityPools/github/providers/cogen-github
  GCP_SERVICE_ACCOUNT: cogen-github-deployer@cogen-506607.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: cogen-runtime@cogen-506607.iam.gserviceaccount.com
  GCP_ARTIFACT_REPOSITORY: cogen
  GEMINI_MODEL: gemini-3.5-flash
  GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite
  GEMINI_SEARCH_GROUNDING: "false"
  GEMINI_ATTEMPTS_PER_MODEL: "1"
  SPECIALIST_RESEARCH_ROUNDS: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6

      - name: Verify
        env:
          RESEARCH_MODE: offline
          DATABASE_BACKEND: sqlite
        run: |
          set -euo pipefail
          uv sync --extra dev --python 3.13
          uv run ruff check app tests
          uv run pytest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Build and push exact image
        id: image
        run: |
          set -euo pipefail
          : "${GEMINI_API_KEY:?missing GEMINI_API_KEY}"
          : "${DATABASE_URL:?missing DATABASE_URL}"
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/cogen:hackathon-${GITHUB_SHA}"
          docker build --pull -t "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy correct production configuration
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = {
            "APP_ENV": "production",
            "DATABASE_BACKEND": "postgres",
            "DATABASE_URL": os.environ["DATABASE_URL"],
            "GEMINI_API_KEY": os.environ["GEMINI_API_KEY"],
            "GOOGLE_API_KEY": os.environ["GEMINI_API_KEY"],
            "GOOGLE_GENAI_USE_VERTEXAI": "false",
            "GEMINI_MODEL": os.environ["GEMINI_MODEL"],
            "GEMINI_FALLBACK_MODEL": os.environ["GEMINI_FALLBACK_MODEL"],
            "GEMINI_SEARCH_GROUNDING": os.environ["GEMINI_SEARCH_GROUNDING"],
            "GEMINI_ATTEMPTS_PER_MODEL": os.environ["GEMINI_ATTEMPTS_PER_MODEL"],
            "SPECIALIST_RESEARCH_ROUNDS": os.environ["SPECIALIST_RESEARCH_ROUNDS"],
            "RESEARCH_PROVIDER": "gemini",
            "RESEARCH_MODE": "live",
            "SPECIALIST_MODE": "orchestrated",
            "GOOGLE_CLOUD_PROJECT": os.environ["GCP_PROJECT_ID"],
            "GOOGLE_CLOUD_LOCATION": os.environ["GCP_REGION"],
          }
          Path('/tmp/cogen-env.yaml').write_text(json.dumps(data))
          PY
          gcloud run deploy "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="${{ steps.image.outputs.uri }}" \
            --service-account="$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --no-invoker-iam-check \
            --ingress=all \
            --default-url \
            --no-cpu-throttling \
            --min-instances=0 \
            --max-instances=3 \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=40 \
            --timeout=300 \
            --env-vars-file=/tmp/cogen-env.yaml \
            --quiet
          gcloud run services add-iam-policy-binding "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --member=allUsers --role=roles/run.invoker --quiet || true
          gcloud run services describe "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --format='yaml(status.latestReadyRevisionName,status.traffic,status.url,metadata.annotations)'

      - name: Start exact production image for release E2E
        run: |
          set -euo pipefail
          docker run -d --name cogen-final-audit --network host \
            -e APP_ENV=production \
            -e DATABASE_BACKEND=postgres \
            -e DATABASE_URL="$DATABASE_URL" \
            -e GEMINI_API_KEY="$GEMINI_API_KEY" \
            -e GOOGLE_API_KEY="$GEMINI_API_KEY" \
            -e GOOGLE_GENAI_USE_VERTEXAI=false \
            -e GEMINI_MODEL="$GEMINI_MODEL" \
            -e GEMINI_FALLBACK_MODEL="$GEMINI_FALLBACK_MODEL" \
            -e GEMINI_SEARCH_GROUNDING="$GEMINI_SEARCH_GROUNDING" \
            -e GEMINI_ATTEMPTS_PER_MODEL="$GEMINI_ATTEMPTS_PER_MODEL" \
            -e SPECIALIST_RESEARCH_ROUNDS="$SPECIALIST_RESEARCH_ROUNDS" \
            -e RESEARCH_PROVIDER=gemini \
            -e RESEARCH_MODE=live \
            -e SPECIALIST_MODE=orchestrated \
            -e GOOGLE_CLOUD_PROJECT="$GCP_PROJECT_ID" \
            -e GOOGLE_CLOUD_LOCATION="$GCP_REGION" \
            "${{ steps.image.outputs.uri }}"
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/readyz >/tmp/ready.json; then
              cat /tmp/ready.json; echo
              break
            fi
            if [ "$i" = 40 ]; then docker logs cogen-final-audit; exit 1; fi
            sleep 2
          done

      - name: Real Gemini + Neon underwriting E2E
        id: live
        run: |
          set -euo pipefail
          URL=http://127.0.0.1:8080
          cat >/tmp/intake.json <<'JSON'
          {
            "idea":"Open a neighbourhood supermarket/minimart",
            "business_type":"supermarket retail",
            "location":"Ruiru, Kiambu County, Kenya",
            "locality":"Ruiru",
            "subdivision":"Kiambu County",
            "country":"Kenya",
            "currency":"KES",
            "locale":"en-KE",
            "launch_target_months":4,
            "founder":{
              "available_capital":1800000,
              "protected_reserve":150000,
              "debt_available":0,
              "target_monthly_owner_income":120000,
              "max_acceptable_loss":600000,
              "time_commitment":"full-time",
              "experience":"final hackathon release audit"
            }
          }
          JSON
          curl -fsS -X POST "$URL/api/ventures" -H 'Content-Type: application/json' \
            --data-binary @/tmp/intake.json -o /tmp/created.json
          VID="$(python -c "import json; print(json.load(open('/tmp/created.json'))['id'])")"
          echo "venture_id=$VID" >> "$GITHUB_OUTPUT"
          CODE="$(curl -sS --max-time 180 -X POST "$URL/api/ventures/$VID/analysis/sync" \
            -o /tmp/analysis.json -w '%{http_code}' || true)"
          echo "ANALYSIS_HTTP_CODE=$CODE"
          if [ "$CODE" != 200 ]; then
            cat /tmp/analysis.json || true; echo
            docker logs cogen-final-audit || true
            exit 1
          fi
          python - <<'PY'
          import json
          ready=json.load(open('/tmp/ready.json'))
          data=json.load(open('/tmp/analysis.json'))
          uw=data.get('underwriting') or {}
          runtime=ready.get('research_runtime') or {}
          model=runtime.get('model') or {}
          print('FINAL_LIVE_E2E_PASS')
          print('database_backend=',ready.get('database_backend'))
          print('research_mode=',ready.get('research_mode'))
          print('model_primary=',model.get('primary'))
          print('last_model_used=',model.get('last_model_used'))
          print('venture_id=',data.get('id'))
          print('decision=',uw.get('decision'))
          print('evidence_count=',len(data.get('evidence') or []))
          print('simulation_runs=',uw.get('simulation_runs'))
          assert ready.get('database_backend')=='postgres'
          assert ready.get('research_mode')=='live'
          assert data.get('id')
          assert data.get('evidence')
          assert int(uw.get('simulation_runs') or 0)>0
          PY
          for suffix in specialists validation events timeline subagents forks contradictions narrative todos; do
            curl -fsS "$URL/api/ventures/$VID/$suffix" -o "/tmp/$suffix.json"
            echo "API_${suffix^^}_PASS"
          done
          curl -fsS -X POST "$URL/api/ventures/$VID/sandbox" \
            -H 'Content-Type: application/json' \
            -d '{"name":"Final audit rent shock","shocks":{"monthly_rent":90000},"simulation_runs":500}' \
            -o /tmp/sandbox.json
          echo API_SANDBOX_PASS

      - name: Real Google ADK conversation E2E
        run: |
          set -euo pipefail
          VID="${{ steps.live.outputs.venture_id }}"
          curl -fsS --no-buffer --max-time 120 \
            -X POST "http://127.0.0.1:8080/api/ventures/$VID/agent/message" \
            -H 'Content-Type: application/json' \
            -d '{"message":"Use inspect_venture now, then tell me the current decision in one concise sentence. Do not start new research."}' \
            -o /tmp/agent-sse.txt
          cat /tmp/agent-sse.txt
          grep -Eq '"type"[[:space:]]*:[[:space:]]*"final"' /tmp/agent-sse.txt
          grep -Eq '"type"[[:space:]]*:[[:space:]]*"done"' /tmp/agent-sse.txt
          echo FINAL_ADK_AGENT_PASS

      - name: Chromium UI E2E
        run: |
          set -euo pipefail
          docker run --rm -i --network host \
            -e BASE_URL=http://127.0.0.1:8080 \
            -e VENTURE_ID="${{ steps.live.outputs.venture_id }}" \
            --entrypoint python "${{ steps.image.outputs.uri }}" - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          base=os.environ['BASE_URL']; vid=os.environ['VENTURE_ID']
          console_errors=[]; http_errors=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              page=browser.new_page(viewport={'width':1440,'height':1000})
              page.on('console',lambda m: console_errors.append(m.text) if m.type=='error' else None)
              page.on('response',lambda r: http_errors.append((r.status,r.url)) if r.url.startswith(base) and r.status>=400 else None)
              page.goto(base+'/',wait_until='networkidle',timeout=60000)
              assert page.title()=='Cogen — Venture Twin'
              assert page.locator('h1',has_text='Ventures').is_visible()
              assert page.get_by_role('button',name='Load demo').is_visible()
              assert page.get_by_role('link',name='New venture').is_visible()
              print('UI_DASHBOARD_PASS')
              checks=[('position','.hero','Blindspots'),('agent','.composer-input',None),('model',None,'Assumption'),('evidence',None,'Admitted evidence'),('sandbox',None,'Scenario runs'),('roadmap',None,'Execution gates'),('forks',None,'Existing forks')]
              for tab,selector,text in checks:
                  page.goto(f'{base}/#/v/{vid}/{tab}',wait_until='networkidle',timeout=60000)
                  if selector: assert page.locator(selector).first.is_visible(),tab
                  if text: assert page.get_by_text(text,exact=True).first.is_visible(),tab
                  print('UI_'+tab.upper()+'_PASS')
              page.goto(base+'/#/new',wait_until='networkidle',timeout=60000)
              page.locator('textarea').fill('Open a small neighborhood bakery')
              page.locator('input').fill('bakery retail')
              page.get_by_role('button',name='Begin').click()
              page.wait_for_selector('.qcard input',timeout=30000)
              assert page.get_by_role('button',name='Continue').is_visible()
              print('UI_INTAKE_PASS')
              page.goto(base+'/',wait_until='networkidle',timeout=60000)
              before=page.locator('html').get_attribute('data-theme')
              page.locator('#theme').click()
              after=page.locator('html').get_attribute('data-theme')
              assert before!=after
              print('UI_THEME_PASS')
              mobile=browser.new_page(viewport={'width':390,'height':844})
              mobile.goto(base+'/',wait_until='networkidle',timeout=60000)
              assert mobile.get_by_role('button',name='Load demo').is_visible()
              assert mobile.get_by_role('link',name='New venture').is_visible()
              print('UI_MOBILE_PASS')
              browser.close()
          if http_errors:
              print('HTTP_ERRORS=',http_errors); raise SystemExit('same-origin HTTP errors')
          if console_errors:
              print('CONSOLE_ERRORS=',console_errors); raise SystemExit('browser console errors')
          print('FINAL_BROWSER_E2E_PASS')
          PY

      - name: Probe Cloud Run public endpoint
        id: public
        run: |
          set -euo pipefail
          CANONICAL="https://${SERVICE_NAME}-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app"
          LEGACY="$(gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          for URL in "$CANONICAL" "$LEGACY"; do
            code="$(curl -sS -o /tmp/public.json -w '%{http_code}' --max-time 30 "$URL/healthz" || true)"
            echo "$URL -> $code"
            if [ "$code" = 200 ]; then
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "PUBLIC_CLOUD_RUN_PASS=$URL"
              exit 0
            fi
          done
          echo "::warning::Cloud Run revision is healthy and deployed, but Google's run.app frontend is still returning 404 before the container. Exact deployed image passed the independent production E2E above."

      - name: Release summary
        if: always()
        run: |
          echo "MODEL=$GEMINI_MODEL"
          echo "FALLBACK_MODEL=$GEMINI_FALLBACK_MODEL"
          echo "GROUNDING=$GEMINI_SEARCH_GROUNDING"
          echo "PUBLIC_URL=${{ steps.public.outputs.url }}"
          gcloud run services describe "$SERVICE_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --format='value(status.latestReadyRevisionName)' || true

      - name: Cleanup
        if: always()
        run: |
          docker logs cogen-final-audit || true
          docker rm -f cogen-final-audit || true
          rm -f /tmp/cogen-env.yaml
