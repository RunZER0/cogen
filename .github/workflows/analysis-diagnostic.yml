name: analysis-diagnostic

on:
  push:
    paths:
      - .github/workflows/analysis-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: cogen-506607
  GCP_REGION: us-central1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/257066508186/locations/global/workloadIdentityPools/github/providers/cogen-github
  GCP_SERVICE_ACCOUNT: cogen-github-deployer@cogen-506607.iam.gserviceaccount.com
  AUDIT_IMAGE: us-central1-docker.pkg.dev/cogen-506607/cogen/cogen:96794badba3d42f065f01c9d54a40dc660bd0438

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Run exact image and print analysis error body
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker pull "$AUDIT_IMAGE" >/dev/null
          docker run -d --name cogen-diagnostic --network host \
            -e APP_ENV=production -e DATABASE_BACKEND=postgres -e DATABASE_URL="$DATABASE_URL" \
            -e GEMINI_API_KEY="$GEMINI_API_KEY" -e GOOGLE_API_KEY="$GEMINI_API_KEY" \
            -e GOOGLE_GENAI_USE_VERTEXAI=false -e GEMINI_MODEL=gemini-3.7-flash \
            -e RESEARCH_PROVIDER=gemini -e RESEARCH_MODE=live -e SPECIALIST_MODE=orchestrated \
            -e GOOGLE_CLOUD_PROJECT="$GCP_PROJECT_ID" -e GOOGLE_CLOUD_LOCATION="$GCP_REGION" \
            "$AUDIT_IMAGE"
          trap 'docker logs cogen-diagnostic || true; docker rm -f cogen-diagnostic || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/readyz >/dev/null && break; sleep 2; done
          cat >/tmp/intake.json <<'JSON'
          {"idea":"Open a neighbourhood supermarket/minimart","business_type":"supermarket retail","location":"Ruiru, Kiambu County, Kenya","locality":"Ruiru","subdivision":"Kiambu County","country":"Kenya","currency":"KES","locale":"en-KE","launch_target_months":4,"founder":{"available_capital":1800000,"protected_reserve":150000,"debt_available":0,"target_monthly_owner_income":120000,"max_acceptable_loss":600000,"time_commitment":"full-time","experience":"diagnostic"}}
          JSON
          curl -fsS -X POST http://127.0.0.1:8080/api/ventures -H 'Content-Type: application/json' --data-binary @/tmp/intake.json -o /tmp/created.json
          VID="$(python -c "import json; print(json.load(open('/tmp/created.json'))['id'])")"
          CODE="$(curl -sS --max-time 290 -X POST "http://127.0.0.1:8080/api/ventures/$VID/analysis/sync" -o /tmp/analysis.json -w '%{http_code}' || true)"
          echo "ANALYSIS_HTTP_CODE=$CODE"
          echo '--- ANALYSIS RESPONSE ---'
          cat /tmp/analysis.json || true
          echo
          echo '--- CONTAINER LOGS ---'
          docker logs cogen-diagnostic || true
          test "$CODE" = "200"
