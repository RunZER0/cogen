name: dispatch-fresh-release

on:
  push:
    paths:
      - .github/workflows/dispatch-fresh-release.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch final release with freshly resolved secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run final-release.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "FRESH_FINAL_RELEASE_DISPATCHED"
