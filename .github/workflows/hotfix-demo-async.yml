name: hotfix-demo-async

on:
  push:
    paths:
      - .github/workflows/hotfix-demo-async.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Restore non-blocking demo endpoint
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('app/main.py')
          text=p.read_text()
          old='''    venture, job = service.create_demo_venture()\n    service.run_analysis_job(job.id)\n    return service.get_venture(venture.id)\n'''
          new='''    venture, job = service.create_demo_venture()\n    _schedule_analysis(service, job.id)\n    return venture\n'''
          if old not in text:
              raise SystemExit('expected demo endpoint block not found')
          p.write_text(text.replace(old,new,1))
          PY
          git diff --check
          git diff -- app/main.py
      - name: Commit hotfix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py
          git commit -m 'Restore asynchronous demo analysis'
          git push origin HEAD:main
