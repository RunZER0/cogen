name: live-adk-agent-proof

on:
  push:
    branches: [flagship/global-agent]
    paths:
      - 'app/**'
      - 'scripts/live_adk_proof.py'
      - 'tests/**'
      - 'agents-cli-manifest.yaml'
      - '.github/workflows/live-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      DATABASE_BACKEND: postgres
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEARCH_MODE: live
      GEMINI_MODEL: gemini-3.7-flash
      GEMINI_FALLBACK_MODEL: gemini-3.6-flash
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_GENAI_USE_VERTEXAI: 'false'
      GOOGLE_CLOUD_PROJECT: cogen-506607
      GOOGLE_CLOUD_LOCATION: us-central1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v6

      - name: Install Cogen and verify baseline
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          test -n "$DATABASE_URL"
          uv sync --extra dev --python 3.13
          uv run pytest

      - name: Run actual Google ADK Runner on Austin coffee-shop venture
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/live_adk_proof.py 2>&1 | tee /tmp/cogen-adk-proof.txt

      - name: Upload agent proof trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cogen-live-adk-proof
          path: /tmp/cogen-adk-proof.txt
          if-no-files-found: warn
          retention-days: 7
