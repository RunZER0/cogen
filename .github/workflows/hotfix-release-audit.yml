name: hotfix-release-audit

on:
  push:
    paths:
      - .github/workflows/hotfix-release-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Fix browser waits and independent public probe
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/final-release.yml')
          text=p.read_text()
          old="""                  if selector: assert page.locator(selector).first.is_visible(),tab\n                  if text: assert page.get_by_text(text,exact=True).first.is_visible(),tab\n"""
          new="""                  if selector:\n                      page.locator(selector).first.wait_for(state='visible',timeout=30000)\n                  if text:\n                      page.get_by_text(text,exact=True).first.wait_for(state='visible',timeout=30000)\n"""
          if old not in text:
              raise SystemExit('browser assertion block not found')
          text=text.replace(old,new,1)
          old2="""      - name: Probe Cloud Run public endpoint\n        id: public\n"""
          new2="""      - name: Probe Cloud Run public endpoint\n        if: always()\n        id: public\n"""
          if old2 not in text:
              raise SystemExit('public probe block not found')
          p.write_text(text.replace(old2,new2,1))
          PY
          git diff --check
          git diff -- .github/workflows/final-release.yml
      - name: Commit audit fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/final-release.yml
          git commit -m 'Wait for async SPA views in release audit'
          git push origin HEAD:main
