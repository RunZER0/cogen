name: app-hotfix

on:
  push:
    paths:
      - .github/workflows/app-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runtime failure handling
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('app/research.py')
          text = p.read_text()

          old = '''        self.context_builder = context_builder or WorkingContextBuilder()\n'''
          new = '''        self.context_builder = context_builder or WorkingContextBuilder()\n        # Search-grounding has its own quota bucket. Once that bucket reports exhaustion,\n        # do not burn the remaining workflow retrying the same unavailable tool for every\n        # specialist. Gemini itself can still be healthy, so degrade to clearly-labelled\n        # model-only estimates and keep the deterministic underwriting workflow alive.\n        self._grounding_available = True\n'''
          if old not in text:
              raise SystemExit('research init anchor not found')
          text = text.replace(old, new, 1)

          old = '''        if emit:\n            emit("tool_call", name="google_search_grounded_generate", args={"role": role.value if role else None})\n        response = self.router.generate(\n            self.client,\n            contents=prompt,\n            config=types.GenerateContentConfig(\n                tools=[types.Tool(google_search=types.GoogleSearch())],\n                response_mime_type="application/json",\n            ),\n        )\n        payload = json.loads(response.text or "[]")\n        if not isinstance(payload, list):\n            raise ValueError("Grounded research response must be a JSON list")\n\n        grounded_urls = self._grounded_urls(response)\n'''
          new = '''        grounding_degraded = not self._grounding_available\n        response = None\n        if self._grounding_available:\n            if emit:\n                emit("tool_call", name="google_search_grounded_generate", args={"role": role.value if role else None})\n            try:\n                response = self.router.generate(\n                    self.client,\n                    contents=prompt,\n                    config=types.GenerateContentConfig(\n                        tools=[types.Tool(google_search=types.GoogleSearch())],\n                        response_mime_type="application/json",\n                    ),\n                )\n            except Exception as exc:\n                message = str(exc).upper()\n                if "RESOURCE_EXHAUSTED" not in message and "429" not in message:\n                    raise\n                self._grounding_available = False\n                grounding_degraded = True\n                if emit:\n                    emit(\n                        "text",\n                        text="Google Search grounding quota is temporarily unavailable; continuing with Gemini model-only estimates at low confidence.",\n                    )\n\n        if response is None:\n            fallback_prompt = prompt.replace(\n                "Search the current web using Google Search grounding.",\n                "Google Search grounding is temporarily unavailable for this run.",\n            ) + """\n\nDEGRADED RESEARCH MODE: You cannot browse or verify current web sources in this call.\nDo not invent URLs, statutes, fees, named suppliers, current prices, or observed market facts.\nYou MAY return rough model estimates for ordinary financial assumptions when useful to run a\nprovisional stress test, but every such item must use evidence_type=model, confidence=low,\nsource_url=null, and source_title=\"Gemini model estimate — grounding unavailable\". For legal,\nregulatory, licensing, tax, or other facts that require a current primary source, omit the claim\nrather than guessing. The deterministic engine will keep those items as unresolved gates.\n"""\n            if emit:\n                emit("tool_call", name="gemini_model_only_generate", args={"role": role.value if role else None})\n            response = self.router.generate(\n                self.client,\n                contents=fallback_prompt,\n                config=types.GenerateContentConfig(response_mime_type="application/json"),\n            )\n\n        payload = json.loads(response.text or "[]")\n        if not isinstance(payload, list):\n            raise ValueError("Research response must be a JSON list")\n\n        grounded_urls = set() if grounding_degraded else self._grounded_urls(response)\n'''
          if old not in text:
              raise SystemExit('research generation anchor not found')
          text = text.replace(old, new, 1)

          old = '''            source_url = raw.get("source_url")\n            confidence = self._confidence(raw.get("confidence"), source_url, grounded_urls)\n            findings.append(\n                ResearchFinding(\n                    assumption_key=str(raw.get("assumption_key", "")).strip(),\n                    claim=str(raw.get("claim", "")).strip(),\n                    value=self._float_or_none(raw.get("value")),\n                    unit=raw.get("unit"),\n                    evidence_type=self._evidence_type(raw.get("evidence_type")),\n                    confidence=confidence,\n                    source_title=str(raw.get("source_title") or "Gemini grounded research"),\n                    source_url=source_url,\n                    notes=raw.get("notes"),\n                    role=role,\n                )\n            )\n'''
          new = '''            source_url = None if grounding_degraded else raw.get("source_url")\n            confidence = (\n                Confidence.LOW\n                if grounding_degraded\n                else self._confidence(raw.get("confidence"), source_url, grounded_urls)\n            )\n            raw_notes = str(raw.get("notes") or "").strip()\n            notes = raw_notes\n            if grounding_degraded:\n                notes = (\n                    "Google Search grounding quota unavailable during this run; model-only estimate, not verified evidence."\n                    + (f" {raw_notes}" if raw_notes else "")\n                )\n            findings.append(\n                ResearchFinding(\n                    assumption_key=str(raw.get("assumption_key", "")).strip(),\n                    claim=str(raw.get("claim", "")).strip(),\n                    value=self._float_or_none(raw.get("value")),\n                    unit=raw.get("unit"),\n                    evidence_type=(\n                        EvidenceType.MODEL\n                        if grounding_degraded\n                        else self._evidence_type(raw.get("evidence_type"))\n                    ),\n                    confidence=confidence,\n                    source_title=(\n                        "Gemini model estimate — grounding unavailable"\n                        if grounding_degraded\n                        else str(raw.get("source_title") or "Gemini grounded research")\n                    ),\n                    source_url=source_url,\n                    notes=notes,\n                    role=role,\n                )\n            )\n'''
          if old not in text:
              raise SystemExit('research parsing anchor not found')
          p.write_text(text.replace(old, new, 1))

          # Make the demo button deterministic for judges: do not redirect to Position while its
          # background analysis is still running.
          p = Path('app/main.py')
          text = p.read_text()
          old = '''    try:\n        venture, job = service.create_demo_venture()\n        task = asyncio.create_task(_run_analysis_background(request.app, job.id))\n        request.app.state.analysis_tasks.add(task)\n        task.add_done_callback(request.app.state.analysis_tasks.discard)\n        return venture\n    except ValueError as exc:\n'''
          new = '''    try:\n        venture, job = service.create_demo_venture()\n        service.run_analysis_job(job.id)\n        return service.get_venture(venture.id)\n    except ValueError as exc:\n'''
          if old not in text:
              raise SystemExit('demo endpoint anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git diff
          git config user.name "cogen-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/research.py app/main.py
          git commit -m "Degrade gracefully when grounding quota is exhausted"
          git push origin HEAD:main
