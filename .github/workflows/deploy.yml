name: deploy-cloud-run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  SERVICE_NAME: cogen
  GCP_PROJECT_ID: cogen-506607
  GCP_PROJECT_NUMBER: "257066508186"
  GCP_REGION: us-central1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/257066508186/locations/global/workloadIdentityPools/github/providers/cogen-github
  GCP_SERVICE_ACCOUNT: cogen-github-deployer@cogen-506607.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: cogen-runtime@cogen-506607.iam.gserviceaccount.com
  GCP_ARTIFACT_REPOSITORY: cogen

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ci-offline-placeholder
      RESEARCH_MODE: offline
      DATABASE_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install and verify
        run: |
          set -euo pipefail
          uv sync --extra dev --python 3.13
          uv run ruff check app tests
          uv run pytest

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Artifact Registry auth
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/cogen:${GITHUB_SHA}"
          docker build --pull -t "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build Cloud Run environment file
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          required = ["GEMINI_API_KEY", "DATABASE_URL"]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing required GitHub secrets: " + ", ".join(missing))

          data = {
              "APP_ENV": "production",
              "DATABASE_BACKEND": "postgres",
              "DATABASE_URL": os.environ["DATABASE_URL"],
              "GEMINI_API_KEY": os.environ["GEMINI_API_KEY"],
              "GOOGLE_API_KEY": os.environ["GEMINI_API_KEY"],
              "GOOGLE_GENAI_USE_VERTEXAI": "false",
              "GEMINI_MODEL": "gemini-3.7-flash",
              "RESEARCH_PROVIDER": "gemini",
              "RESEARCH_MODE": "live",
              "GOOGLE_CLOUD_PROJECT": os.environ["GCP_PROJECT_ID"],
              "GOOGLE_CLOUD_LOCATION": os.environ["GCP_REGION"],
          }
          Path("/tmp/cogen-env.yaml").write_text(json.dumps(data))
          PY

      - name: Deploy to Cloud Run
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="${{ steps.image.outputs.uri }}" \
            --service-account="$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --no-invoker-iam-check \
            --ingress=all \
            --default-url \
            --min-instances=0 \
            --max-instances=3 \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=40 \
            --timeout=300 \
            --env-vars-file=/tmp/cogen-env.yaml \
            --quiet

          # Keep the legacy public binding too. The disabled invoker check is the current
          # Google-recommended public-access mechanism and also works under domain restrictions.
          gcloud run services add-iam-policy-binding "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --quiet || true

          echo "--- Cloud Run endpoint/security state ---"
          gcloud run services describe "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='yaml(metadata.annotations,status.url,status.address)'

      - name: Resolve and verify public service
        id: service
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL="https://${SERVICE_NAME}-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app"
          LEGACY="$(gcloud run services describe "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.url)')"

          URL=""
          for candidate in "$CANONICAL" "$LEGACY"; do
            [ -n "$candidate" ] || continue
            echo "Probing $candidate"
            for attempt in $(seq 1 6); do
              code="$(curl --silent --output /tmp/health.json --write-out '%{http_code}' \
                --connect-timeout 10 --max-time 30 "$candidate/healthz" || true)"
              echo "health attempt $attempt -> $code"
              if [ "$code" = "200" ]; then
                URL="$candidate"
                cat /tmp/health.json
                echo
                break 2
              fi
              sleep 3
            done
          done

          if [ -z "$URL" ]; then
            echo "Neither Cloud Run hostname is publicly serving /healthz."
            exit 1
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "CLOUD_RUN_URL=$URL"
          curl --fail --silent --show-error --max-time 30 "$URL/readyz" -o /tmp/ready.json
          cat /tmp/ready.json
          echo

      - name: Run deployed canonical demo
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.service.outputs.url }}"
          curl --fail --silent --show-error \
            --max-time 290 \
            -X POST "$URL/api/demo" \
            -H 'Content-Type: application/json' \
            -o /tmp/cogen-live-demo.json

          python - <<'PY'
          import json
          from pathlib import Path

          ready = json.loads(Path('/tmp/ready.json').read_text())
          data = json.loads(Path('/tmp/cogen-live-demo.json').read_text())
          underwriting = data.get('underwriting') or {}
          print('CLOUD_RUN_E2E_PASS')
          print('database_backend=', ready.get('database_backend'))
          print('research_mode=', ready.get('research_mode'))
          print('venture_id=', data.get('id'))
          print('decision=', underwriting.get('decision'))
          print('simulation_runs=', underwriting.get('simulation_runs'))
          if ready.get('database_backend') != 'postgres':
              raise SystemExit('Cloud Run is not using Postgres/Neon')
          if ready.get('research_mode') != 'live':
              raise SystemExit('Cloud Run is not using live research')
          if not data.get('id'):
              raise SystemExit('live demo returned no venture id')
          PY

      - name: Browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.service.outputs.url }}"
          VENTURE_ID="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('/tmp/cogen-live-demo.json').read_text())['id'])
          PY
          )"
          docker run --rm -i \
            -e BASE_URL="$URL" \
            -e VENTURE_ID="$VENTURE_ID" \
            --entrypoint python \
            "${{ steps.image.outputs.uri }}" - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          base = os.environ['BASE_URL'].rstrip('/')
          venture_id = os.environ['VENTURE_ID']
          console_errors = []
          bad_same_origin = []

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=['--no-sandbox'])
              page = browser.new_page(viewport={"width": 1440, "height": 1000})
              page.on('console', lambda m: console_errors.append(m.text) if m.type == 'error' else None)
              page.on('response', lambda r: bad_same_origin.append((r.status, r.url))
                      if r.url.startswith(base) and r.status >= 400 else None)

              page.goto(base + '/', wait_until='networkidle', timeout=60000)
              assert page.title() == 'Cogen — Venture Twin', page.title()
              assert page.locator('h1', has_text='Ventures').is_visible()
              assert page.get_by_role('button', name='Load demo').is_visible()
              assert page.get_by_role('link', name='New venture').is_visible()
              print('BROWSER_INDEX_PASS')

              page.goto(f'{base}/#/v/{venture_id}/position', wait_until='networkidle', timeout=60000)
              assert page.locator('.hero').is_visible()
              assert page.get_by_text('Blindspots', exact=True).is_visible()
              print('BROWSER_POSITION_PASS')

              checks = [
                  ('agent', '.composer-input', None),
                  ('model', None, 'Assumption'),
                  ('evidence', None, 'Admitted evidence'),
                  ('sandbox', None, 'Scenario runs'),
                  ('roadmap', None, 'Execution gates'),
                  ('forks', None, 'Existing forks'),
              ]
              for tab, selector, text in checks:
                  page.goto(f'{base}/#/v/{venture_id}/{tab}', wait_until='networkidle', timeout=60000)
                  if selector:
                      assert page.locator(selector).is_visible(), tab
                  if text:
                      assert page.get_by_text(text, exact=True).first.is_visible(), tab
                  print(f'BROWSER_{tab.upper()}_PASS')

              page.goto(base + '/#/new', wait_until='networkidle', timeout=60000)
              page.locator('textarea').fill('Open a small neighborhood bakery')
              page.locator('input').fill('bakery retail')
              page.get_by_role('button', name='Begin').click()
              page.wait_for_selector('.qcard input', timeout=30000)
              assert page.get_by_role('button', name='Continue').is_visible()
              print('BROWSER_INTAKE_PASS')

              page.goto(base + '/', wait_until='networkidle', timeout=60000)
              before = page.locator('html').get_attribute('data-theme')
              page.locator('#theme').click()
              after = page.locator('html').get_attribute('data-theme')
              assert before != after
              print('BROWSER_THEME_PASS')

              browser.close()

          if bad_same_origin:
              print('BAD_SAME_ORIGIN_RESPONSES=', bad_same_origin)
              raise SystemExit('same-origin browser requests returned HTTP errors')
          if console_errors:
              print('CONSOLE_ERRORS=', console_errors)
              raise SystemExit('browser console emitted errors')
          print('BROWSER_UI_E2E_PASS')
          PY

      - name: Final deployment URL
        if: success()
        run: echo "PUBLIC_COGEN_URL=${{ steps.service.outputs.url }}"

      - name: Cleanup
        if: always()
        run: rm -f /tmp/cogen-env.yaml /tmp/health.json /tmp/ready.json /tmp/cogen-live-demo.json
