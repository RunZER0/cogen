name: deploy-cloud-run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cogen-cloud-run-main
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  dispatch-verified-release:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the single verified Cloud Run release pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run final-release.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "VERIFIED_RELEASE_DISPATCHED"
