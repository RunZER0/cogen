name: deploy-cloud-run

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: cogen-model-switch-main
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  SERVICE_NAME: cogen
  GCP_PROJECT_ID: cogen-506607
  GCP_REGION: us-central1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/257066508186/locations/global/workloadIdentityPools/github/providers/cogen-github
  GCP_SERVICE_ACCOUNT: cogen-github-deployer@cogen-506607.iam.gserviceaccount.com

jobs:
  switch-production-model:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Switch Cogen production to Gemini 3.7 Flash
        run: |
          set -euo pipefail
          gcloud run services update "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --update-env-vars=GEMINI_MODEL=gemini-3.7-flash \
            --quiet
          gcloud run services describe "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json >/tmp/service.json
          MODEL="$(python - <<'PY'
          import json
          data=json.load(open('/tmp/service.json'))
          env=data['spec']['template']['spec']['containers'][0].get('env',[])
          print(next((item.get('value','') for item in env if item.get('name')=='GEMINI_MODEL'),''))
          PY
          )"
          REVISION="$(python - <<'PY'
          import json
          data=json.load(open('/tmp/service.json'))
          print(data.get('status',{}).get('latestReadyRevisionName',''))
          PY
          )"
          echo "PRODUCTION_MODEL=$MODEL"
          echo "REVISION=$REVISION"
          test "$MODEL" = "gemini-3.7-flash"
