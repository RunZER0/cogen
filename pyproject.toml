[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "venture-twin-agent"
version = "0.2.0"
description = "Persistent venture underwriting and execution partner for the Google All Things Agentic Hackathon."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1",
  "uvicorn[standard]>=0.35.0,<1",
  "pydantic>=2.11.0,<3",
  "pydantic-settings>=2.10.0,<3",
  "google-adk[gcp]>=2.0.0,<3",
  "google-genai>=2.0.0,<3",
  "httpx>=0.28.0,<1",
  "openai>=1.100.0,<3",
  "psycopg[binary,pool]>=3.2.0,<4",
  "playwright>=1.55.0,<2",
  "sqlalchemy>=2.0.0,<3",
  "aiosqlite>=0.20.0,<1",
  "asyncpg>=0.29.0,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0,<9",
  "pytest-cov>=6.2.0,<7",
  "ruff>=0.12.0,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# CI lint is deliberately limited to hard correctness failures. Formatting is not a launch gate.
select = ["E9", "F63", "F7", "F82"]
